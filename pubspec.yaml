name: recipe_app
description: "Recipe & Event Social Platform - A platform connecting recipe management with event hosting"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12
  firebase_storage: ^12.4.10
  firebase_messaging: ^15.2.10
  firebase_analytics: ^11.6.0
  firebase_crashlytics: ^4.3.10
  firebase_dynamic_links: ^6.1.10
  google_sign_in: ^6.2.0

  # State Management
  flutter_riverpod: ^3.0.3

  # Navigation
  go_router: ^17.0.0

  # UI Components
  cached_network_image: ^3.3.0
  image_picker: ^1.0.5
  flutter_rating_bar: ^4.0.1
  shimmer: ^3.0.0

  # Utilities
  intl: any
  uuid: ^4.2.0
  share_plus: ^12.0.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.1.3
  wakelock_plus: ^1.2.0
  shared_preferences: ^2.2.2

  # Forms & Validation
  flutter_form_builder: ^10.2.0
  form_builder_validators: ^11.2.0

  # Networking
  dio: ^5.4.0

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
